name: desktop

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools brotli
      - run: npm run build:desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: List installer sizes
        shell: pwsh
        run: Get-ChildItem dist-desktop -File | ForEach-Object { "{0}`t{1}" -f $_.Name, $_.Length }
      - uses: actions/upload-artifact@v4
        with:
          name: lexiquest-windows
          path: dist-desktop/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools brotli
      # Ad-hoc identity is "-". There is no certificate and no CSC_LINK.
      # electron-builder skips signing on pull requests unless this is set.
      - run: npm run build:desktop:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: "true"
      - name: Verify ad-hoc signature
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mac-apps"
          for zip in dist-desktop/*.zip; do
            echo "==== $zip ===="
            unzip -q "$zip" -d "$RUNNER_TEMP/mac-apps/$(basename "$zip" .zip)"
          done
          find "$RUNNER_TEMP/mac-apps" -name '*.app' -print0 | while IFS= read -r -d '' app; do
            echo "==== codesign $app ===="
            codesign -dv --verbose=4 "$app"
            codesign --verify --verbose=2 "$app"
          done
      - name: List installer sizes
        run: ls -l dist-desktop/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lexiquest-mac
          path: dist-desktop/*.zip
          if-no-files-found: error

  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools brotli
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libgtk-3-0 libasound2t64 \
            || sudo apt-get install -y xvfb libnss3 libgbm1 libgtk-3-0t64 libasound2t64
      - run: npm run build:desktop:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: xvfb-run -a env LEXIQUEST_SMOKE_NO_SANDBOX=1 LEXIQUEST_SHOTS=dist-desktop/smoke npm run smoke:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: lexiquest-linux-smoke
          path: dist-desktop/smoke/*.png
          if-no-files-found: error
