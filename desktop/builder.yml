appId: com.lexiquest.desktop
productName: LexiQuest
executableName: lexiquest
asar: true
npmRebuild: false
directories:
  output: dist-desktop
# dist already contains Phaser and ts-fsrs. Do not copy node_modules into the asar.
# Icon stays the Electron default until art lands. Then set win.icon and mac.icon,
# for example win.icon: desktop/icon.ico and mac.icon: desktop/icon.icns.
files:
  - desktop/main.mjs
  - desktop/preload.mjs
  - desktop/protocol-path.mjs
  - desktop/app-identity.mjs
  - dist/**/*
  - package.json
  - "!**/node_modules/**"
extraMetadata:
  main: desktop/main.mjs
copyright: Copyright © 2026 LexiQuest
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  # Skip signing only. resedit still writes the product name, version, company, and description.
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LexiQuest-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Default is false. Left explicit so an uninstall keeps userData.
  deleteAppDataOnUninstall: false
mac:
  identity: "-"
  gatekeeperAssess: false
  hardenedRuntime: false
  target:
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: LexiQuest-${version}-mac-${arch}.${ext}
linux:
  category: Game
  target:
    - target: dir
      arch:
        - x64
