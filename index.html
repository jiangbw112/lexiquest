<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143d2c" />
    <title>词境冒险 LexiQuest</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      html, body, #game { margin: 0; height: 100%; background: #143d2c; }
      body { overflow: hidden; font-family: "WenQuanYi Micro Hei", "Noto Sans SC", "PingFang SC", sans-serif; }
      #game { width: 100%; height: 100%; }
      #webgl-needed {
        box-sizing: border-box;
        min-height: 100%;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 48px;
        color: #fff4dc;
        font-size: 28px;
        line-height: 1.6;
        text-align: center;
      }
      #name-form, #spell-form, #pin-form {
        display: none;
        position: fixed;
        z-index: 3;
        gap: 12px;
        box-sizing: border-box;
      }
      #name-form.open, #spell-form.open, #pin-form.open { display: grid; }
      #name-form {
        left: 474px;
        top: 284px;
        width: 332px;
        padding: 0;
        background: transparent;
      }
      #spell-form {
        left: 50%;
        top: 62%;
        transform: translate(-50%, -50%);
        width: 332px;
        padding: 16px;
        background: #fff4dc;
        border: 2px solid #3b2a20;
        border-radius: 18px;
      }
      #pin-form {
        left: 430px;
        top: 130px;
        width: 420px;
        min-height: 520px;
        padding: 24px 30px;
        background: #fff4dc;
        border: 3px solid #3b2a20;
        border-radius: 28px;
      }
      #pin-form label, #name-form label, #spell-form label { display: grid; gap: 6px; color: #3b2a20; }
      #hero-name, #spell-input, #pin-input, #pin-confirm, #pin-answer {
        font: inherit;
        font-size: 22px;
        color: #3b2a20;
        background: #fff4dc;
        border: 2px solid #3b2a20;
        border-radius: 16px;
        padding: 0 14px;
        height: 56px;
        box-sizing: border-box;
      }
      #hero-name, #name-form button { width: 332px; }
      #pin-input, #pin-confirm, #pin-answer, #pin-submit { width: 360px; }
      #spell-input, #spell-form button { width: 100%; }
      #name-error, #spell-error, #pin-error { color: #834735; margin: 0; min-height: 1.2em; }
      #spell-hint { margin: 0; color: #61402d; min-height: 1.2em; }
      #pin-title { margin: 0; color: #fff4dc; background: #3b2a20; border-radius: 12px; padding: 8px 12px; text-align: center; font-size: 22px; }
      #pin-note, #pin-cooldown, #pin-challenge { margin: 0; color: #46363a; font-size: 14px; }
      #name-form button, #spell-form button, #pin-form button[type="submit"] {
        height: 56px;
        background: #e9c46a;
        color: #3b2a20;
        border: 2px solid #3b2a20;
        border-radius: 16px;
        font-size: 22px;
      }
      #pin-form button[type="submit"]:disabled {
        background: #cfc4b2;
        color: #3f2e25;
        border-color: #7e6f62;
        box-shadow: none;
        cursor: default;
      }
      #pin-forgot-button {
        width: 160px;
        height: 48px;
        margin: 0 auto;
        background: #fff4dc;
        color: #3b2a20;
        border: 2px solid #3b2a20;
        border-radius: 14px;
        font-size: 18px;
        cursor: pointer;
      }
      #pin-confirm-label.hidden, #pin-forgot.hidden, #pin-entry.hidden { display: none; }
      #lexi-probe { position: absolute; width: 1px; height: 1px; overflow: hidden; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <form id="name-form">
      <label>名字<input id="hero-name" maxlength="12" autocomplete="off" /></label>
      <p id="name-error"></p>
      <button type="submit">出发</button>
    </form>
    <form id="spell-form">
      <label>拼写<input id="spell-input" autocomplete="off" autocapitalize="off" spellcheck="false" /></label>
      <p id="spell-hint"></p>
      <p id="spell-error"></p>
      <button type="submit">确认</button>
    </form>
    <form id="pin-form">
      <p id="pin-title">家长密码</p>
      <p id="pin-note">用来避免孩子不小心改掉年级和每日目标。清掉这台浏览器的数据后要重新设置。这不是安全登录。</p>
      <p id="pin-cooldown"></p>
      <div id="pin-entry">
        <label>密码<input id="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" /></label>
        <label id="pin-confirm-label">再输入一次<input id="pin-confirm" type="password" inputmode="numeric" maxlength="6" autocomplete="off" /></label>
      </div>
      <div id="pin-forgot" class="hidden">
        <p id="pin-challenge"></p>
        <label>答案<input id="pin-answer" inputmode="numeric" autocomplete="off" /></label>
      </div>
      <p id="pin-error"></p>
      <button id="pin-submit" type="submit">确认</button>
      <button id="pin-forgot-button" type="button">忘记密码</button>
    </form>
    <pre id="lexi-probe"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
