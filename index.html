<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143d2c" />
    <title>词境冒险 LexiQuest</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body, #game { margin: 0; height: 100%; background: #143d2c; }
      body { overflow: hidden; font-family: "WenQuanYi Micro Hei", "Noto Sans SC", "PingFang SC", sans-serif; }
      #game { width: 100%; height: 100%; }
      #name-form, #spell-form, #pin-form {
        display: none;
        position: fixed;
        z-index: 3;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        background: #fff8ee;
        padding: 16px 18px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        gap: 8px;
      }
      #name-form.open, #spell-form.open, #pin-form.open { display: grid; }
      #hero-name, #spell-input, #pin-input, #pin-confirm { font: inherit; font-size: 18px; padding: 8px 10px; width: 240px; }
      #name-error, #spell-error, #pin-error { color: #a33b24; margin: 0; min-height: 1.2em; }
      #pin-title { margin: 0; color: #17352a; }
      #pin-confirm-label.hidden { display: none; }
      #lexi-probe { position: absolute; width: 1px; height: 1px; overflow: hidden; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <form id="name-form">
      <label>名字<input id="hero-name" maxlength="12" autocomplete="off" /></label>
      <p id="name-error"></p>
      <button type="submit">出发</button>
    </form>
    <form id="spell-form">
      <label>拼写<input id="spell-input" autocomplete="off" autocapitalize="off" spellcheck="false" /></label>
      <p id="spell-error"></p>
      <button type="submit">确认</button>
    </form>
    <form id="pin-form">
      <p id="pin-title">家长密码</p>
      <label>密码<input id="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off" /></label>
      <label id="pin-confirm-label">再输入一次<input id="pin-confirm" type="password" inputmode="numeric" maxlength="8" autocomplete="off" /></label>
      <p id="pin-error"></p>
      <button type="submit">确认</button>
    </form>
    <pre id="lexi-probe"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
